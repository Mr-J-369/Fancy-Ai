[package]
name = "fancy_memory_tokenizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
