org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
# Keep the daemon warm through a full Android Studio work session.
org.gradle.daemon.idletimeout=86400000
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Required by the build-script form: AGP-provided Kotlin + new DSL (extensions.configure<ApplicationExtension>).
android.builtInKotlin=true
android.newDsl=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
